# Runs the whole NewsByte stack:
#   postgres, rabbitmq -> migrate (one-off) -> backend API + consumer -> frontend
#   scrapper (Scrapy + TF-IDF/TextRank summarizer) publishes to rabbitmq on a schedule
#
# Setup: copy .env.template to .env and fill in the secrets, then
#   docker compose up -d --build

name: newsbyte

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newspassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsuser -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest / guest)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Applies Prisma migrations once, then exits
  migrate:
    build: ./backend
    image: newsbyte-backend
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment: &backend-env
      DATABASE_URL: postgresql://newsuser:${POSTGRES_PASSWORD:-newspassword}@postgres:5432/news_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MQ_SECRET_KEY: ${MQ_SECRET_KEY:?Set MQ_SECRET_KEY in .env}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  # REST API, Swagger at http://localhost:3000/swagger
  backend:
    build: ./backend
    image: newsbyte-backend
    restart: unless-stopped
    command: ["node", "dist/main"]
    environment: *backend-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Saves articles from scraped_data_queue into PostgreSQL
  consumer:
    build: ./backend
    image: newsbyte-backend
    restart: unless-stopped
    command: ["node", "dist/rabbit-mq"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Scrapy spiders + NLP summarizer; runs all spiders every SCRAPE_INTERVAL seconds
  scrapper:
    build: ./scrapper/news_scrapper
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      MQ_SECRET_KEY: ${MQ_SECRET_KEY:?Set MQ_SECRET_KEY in .env}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-21600}
    depends_on:
      rabbitmq:
        condition: service_healthy
      consumer:
        condition: service_started

  # React app served by nginx; the browser calls the API at http://localhost:3000
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitmqdata:
